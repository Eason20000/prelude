name: build
# Build check on every push; also reusable via workflow_call (see release.yml).
# Packages and uploads artifacts in both cases.
#
# Thin orchestration only: assembly lives in build-aux/pack_*.py, exposed as
# `meson compile pack-windows/pack-linux/pack-macos`, so local runs
# reproduce CI byte-for-byte. This file only installs deps, configures Meson
# and renames artifacts with the release suffix.
#
# Windows runs under MSYS2-UCRT64: only MSYS2 ships prebuilt libadwaita,
# blueprint-compiler and a GNU Rust that links them. Shells are pinned per
# step with literal values — expressions are rejected in shell positions, so
# there is no shared matrix-wide default.
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: "Version suffix for artifact names, e.g. -v1.2.0 (empty for plain names)"
        type: string
        default: ""
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
          - os: ubuntu-26.04
            asset: linux-x64
          - os: macos-14
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable autocrlf (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'
      # sccache: GHA-backed compiler cache shared across branches.
      # No build-file changes needed — the wrapper reaches cargo through
      # process env, which our Meson cargo_env passes through. Unix uses the
      # bare name (action puts it on PATH); Windows/MSYS2 gets the absolute
      # path (sccache-action exposes SCCACHE_PATH but does not extend the
      # msys PATH, and the Enable step runs in pwsh there, not bash).
      # Validated: Linux 72s -> 14s, macOS 96s -> 19s, both 100% hits.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - name: Enable sccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=$env:SCCACHE_PATH.exe" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "SCCACHE_GHA_ENABLED=true" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "CARGO_INCREMENTAL=0" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkgconf meson ninja-build libgtk-4-dev libadwaita-1-dev blueprint-compiler gobject-introspection libasound2-dev librsvg2-bin librsvg2-dev desktop-file-utils appstream gettext
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install gtk4 libadwaita adwaita-icon-theme meson pkgconf blueprint-compiler dylibbundler
      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-rust             mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-libadwaita mingw-w64-ucrt-x86_64-adwaita-icon-theme mingw-w64-ucrt-x86_64-blueprint-compiler mingw-w64-ucrt-x86_64-librsvg
      - name: Meson setup (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          meson setup --buildtype=release -Dinstaller=true -Dversion_suffix="${{ inputs.version }}" builddir
      - name: Meson setup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          meson setup --buildtype=release -Dfetch_external=true -Dversion_suffix="${{ inputs.version }}" builddir
      - name: Meson setup (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          meson setup --buildtype=release -Dversion_suffix="${{ inputs.version }}" builddir
      - name: Compile + branding (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          meson compile -C builddir
          meson compile -C builddir check-branding
      - name: Compile + branding + validate (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          meson compile -C builddir
          meson compile -C builddir check-branding
          if [ "$RUNNER_OS" = "Linux" ]; then
            desktop=$(ls builddir/data/*.desktop | head -1)
            desktop-file-validate "$desktop"
            appstreamcli validate --no-net "builddir/data/"*.metainfo.xml
          fi
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # Artifact names (incl. release suffix) are decided by Meson
        # (-Dversion_suffix=); this step only builds. The Inno .iss was
        # generated alongside (--installer); iscc runs below via choco.
        run: meson compile -C builddir pack-windows
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" builddir/prelude_inno.iss
      - name: Pack (Linux AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: meson compile -C builddir pack-linux
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: meson compile -C builddir pack-macos
      - name: sccache stats (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Same server the msys compile talked to (per-user TCP); absolute
        # path dodges both msys PATH and backslash-escaping pitfalls.
        # Quoted: a leading & would otherwise parse as a YAML anchor.
        run: '& "$env:SCCACHE_PATH.exe" --show-stats'
      - name: sccache stats (Unix)
        if: runner.os != 'Windows'
        run: sccache --show-stats
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: prelude-${{ matrix.asset }}
          path: |
            builddir/prelude-*
            builddir/Prelude-*
            builddir/Output/*.exe
            builddir/Output/*.sha256
          if-no-files-found: error
          retention-days: 7
