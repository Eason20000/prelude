name: build
# Build check on every push; also reusable via workflow_call (see release.yml).
# Packages and uploads artifacts in both cases.
#
# Thin orchestration only: assembly lives in build-aux/pack_*.py, exposed as
# `meson compile pack-windows/pack-linux/pack-macos`, so local runs
# reproduce CI byte-for-byte. This file only installs deps, configures Meson
# and renames artifacts with the release suffix.
#
# Windows runs under MSYS2-UCRT64: only MSYS2 ships prebuilt libadwaita,
# blueprint-compiler and a GNU Rust that links them. Shells are pinned per
# step with literal values — expressions are rejected in shell positions, so
# there is no shared matrix-wide default.
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: "Version suffix for artifact names, e.g. -v1.2.0 (empty for plain names)"
        type: string
        default: ""
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
          - os: ubuntu-26.04
            asset: linux-x64
          - os: macos-14
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable autocrlf (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkgconf meson ninja-build libgtk-4-dev libadwaita-1-dev blueprint-compiler gobject-introspection libasound2-dev librsvg2-bin librsvg2-dev desktop-file-utils appstream
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install gtk4 libadwaita adwaita-icon-theme meson pkgconf blueprint-compiler dylibbundler
      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-rust             mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-libadwaita mingw-w64-ucrt-x86_64-adwaita-icon-theme mingw-w64-ucrt-x86_64-blueprint-compiler mingw-w64-ucrt-x86_64-librsvg
      - name: Meson setup (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          meson setup --buildtype=release -Dinstaller=true builddir
      - name: Meson setup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          meson setup --buildtype=release -Dfetch_external=true builddir
      - name: Meson setup (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          meson setup --buildtype=release builddir
      - name: Compile + branding (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          meson compile -C builddir
          meson compile -C builddir check-branding
      - name: Compile + branding + validate (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          meson compile -C builddir
          meson compile -C builddir check-branding
          desktop=$(ls builddir/data/*.desktop | head -1)
          desktop-file-validate "$desktop"
          if [ "$RUNNER_OS" = "Linux" ]; then
            appstreamcli validate --no-net "builddir/data/"*.metainfo.xml || true
          fi
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          meson compile -C builddir pack-windows
          SUFFIX="${{ inputs.version }}"
          mv builddir/prelude-windows-x64.zip "prelude$SUFFIX-windows-x64.zip"
          sha256sum "prelude$SUFFIX-windows-x64.zip" > "prelude$SUFFIX-windows-x64.zip.sha256"
          # Inno installer: pack_windows.py generated builddir/prelude_inno.iss
          # (--installer); iscc runs here where choco provides it.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" builddir/prelude_inno.iss
          $SUFFIX = "${{ inputs.version }}"
          $exe = Get-ChildItem builddir/Output/*.exe | Select-Object -First 1
          $dest = "prelude$SUFFIX-windows-x64-setup.exe"
          Copy-Item $exe.FullName $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          "$hash  $dest" | Out-File "$dest.sha256" -Encoding ascii
      - name: Pack (Linux AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          meson compile -C builddir pack-linux
          SUFFIX="${{ inputs.version }}"
          mv builddir/Prelude-linux-x64.AppImage "Prelude$SUFFIX-linux-x64.AppImage"
          sha256sum "Prelude$SUFFIX-linux-x64.AppImage" > "Prelude$SUFFIX-linux-x64.AppImage.sha256"
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          meson compile -C builddir pack-macos
          SUFFIX="${{ inputs.version }}"
          mv builddir/Prelude-macos-arm64.dmg "Prelude$SUFFIX-macos-arm64.dmg"
          shasum -a 256 "Prelude$SUFFIX-macos-arm64.dmg" > "Prelude$SUFFIX-macos-arm64.dmg.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: prelude-${{ matrix.asset }}
          path: |
            prelude-*
            Prelude-*
          if-no-files-found: error
          retention-days: 7
